[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simorc"
version = "0.1.0"
description = "Simulation Orchestrator for deterministic simulations, surrogates, sensitivity, and probabilistic validation."
authors = [
  { name = "Lloyd Fletcher", email = "thescepticalrabbit@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
  "pyvista>=0.40.0",
  "netCDF4>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
]
advanced = [
  "SALib>=1.4.0",
  "smt>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simorc = ["data/**/*", "data/elastic2d/*"]
